name: Recommend System CI/CD to GCP

on:
  push:
    branches: [ "main", "async" ]
    paths:
      - 'recommend_system/**'
      - '.github/workflows/recommend-system-cicd.yml'
      - 'docker-compose.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'recommend_system/**'
      - '.github/workflows/recommend-system-cicd.yml'

env:
  PROJECT_ID: 'tourist-assistant-6710f'
  REGION: 'asia-southeast1'
  GAR_REPO: 'tourism-frontend'
  SERVICE_NAME: 'tourism-recommend-system'
  IMAGE_NAME: 'recommend-system'

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  # ── Job 1 : Test & Validation ──────────────────────────────────────────────
  test:
    name: Config & Code Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./recommend_system
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

  # ── Job 2 : Docker Compose Integration Test ──────────────────────────────
  integration-test:
    name: Integration Test (Docker Compose)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env from defaults
        run: |
          cp .env.example .env || true
          cp login/.env.example login/.env || true
          touch rag/.env || true

      - name: Start services via Docker Compose
        run: docker compose up -d --build --wait recommend_system postgres redis

      - name: Wait for Recommend System to be ready
        run: |
          echo "Waiting for Recommend System to respond on mapped host port 8002..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8002/health > /dev/null 2>&1; then
              echo "Recommend System is up!"
              exit 0
            fi
            echo "  attempt $i/30 — not ready yet, retrying in 5s..."
            sleep 5
          done
          echo "Recommend System failed to start in time."
          docker compose logs recommend_system
          exit 1

      - name: Verify health endpoint responds correctly
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8002/health)
          if [ "$STATUS" -eq 200 ]; then
            echo "Health endpoint returned 200 OK"
          else
            echo "Health endpoint returned unexpected status: $STATUS"
            exit 1
          fi

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ── Job 3 : Build & Deploy ──────────────────────────────────────────────
  deploy:
    name: Build & Deploy to Cloud Run
    needs: integration-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Authenticate to GCP via Workload Identity Federation (WIF)
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 2. Configure Docker to use GCP Artifact Registry
      - name: Configure Docker Auth
        run: |-
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # 3. Build & Push using the Recommend System Dockerfile (utilizes .dockerignore)
      - name: Build and Push Docker Image
        working-directory: ./recommend_system
        run: |-
          DOCKER_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build -t $DOCKER_TAG .
          docker push $DOCKER_TAG

      # 4. Deploy to Cloud Run
      - name: Deploy to Cloud Run
        run: |-
          DOCKER_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image $DOCKER_TAG \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --cpu=2 \
            --memory=2Gi \
            --set-secrets="\
              DATABASE_URL=FIREBASE_URL:latest,\
              FIREBASE_STORAGE_BUCKET=FIREBASE_STORAGE_BUCKET:latest,\
              REDIS_ADDR=REDIS_ADDR:latest,\
              REDIS_PASSWORD=REDIS_PASSWORD:latest" \
            --set-env-vars="PUBSUB_ENABLE_PULL_SUBSCRIBER=false,PUBSUB_OUTPUT_TOPIC_ID=ai-results,PUBSUB_ERROR_TOPIC_ID=ai-results" \
            --timeout=3600

