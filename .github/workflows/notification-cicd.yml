name: Notification Service CI/CD to GCP

on:
  push:
    branches: [ "main", "ux/ui" ]
    paths:
      - 'notification/**'
      - '.github/workflows/notification-cicd.yml'
      - 'docker-compose.yml'
  pull_request:
    branches: [ "main", "ux/ui" ]
    paths:
      - 'notification/**'
      - '.github/workflows/notification-cicd.yml'

env:
  PROJECT_ID: 'touristassistant-29-03-2026'
  REGION: 'asia-southeast1'
  GAR_REPO: 'tourism-frontend'
  SERVICE_NAME: 'tourism-notification-service'
  IMAGE_NAME: 'notification-service'

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  # ── Job 1 : Build & Validation ──────────────────────────────────────────
  validate:
    name: Go Build & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: notification/go.sum

      - name: Download dependencies
        working-directory: ./notification
        run: go mod tidy

      - name: Build binary
        working-directory: ./notification
        run: go build -o notification .

      - name: Run vet
        working-directory: ./notification
        run: go vet ./...

  # ── Job 2 : Docker Compose Integration Test ──────────────────────────────
  integration-test:
    name: Integration Test (Docker Compose)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env from defaults
        run: |
          cp .env.example .env || true
          cp login/.env.example login/.env || true
          touch rag/.env || true

      - name: Start services via Docker Compose
        run: docker compose up -d --build --wait notification

      - name: Wait for Notification Service to be ready
        run: |
          echo "Waiting for Notification Service to respond on port 8080..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "Notification Service is up!"
              exit 0
            fi
            echo "  attempt $i/30 — not ready yet, retrying in 5s..."
            sleep 5
          done
          echo "Notification Service failed to start in time."
          docker compose logs notification
          exit 1

      - name: Verify health endpoint responds correctly
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health)
          if [ "$STATUS" -eq 200 ]; then
            echo "Health endpoint returned 200 OK"
          else
            echo "Health endpoint returned unexpected status: $STATUS"
            exit 1
          fi

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ── Job 3 : Build & Deploy ──────────────────────────────────────────────
  deploy:
    name: Build & Deploy to Cloud Run
    needs: integration-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Authenticate to GCP via WIF
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 2. Configure Docker to use GCP Artifact Registry
      - name: Configure Docker Auth
        run: |-
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # 3. Build & Push using the Notification Dockerfile
      - name: Build and Push Docker Image
        working-directory: ./notification
        run: |-
          DOCKER_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build -t $DOCKER_TAG .
          docker push $DOCKER_TAG

      # 4. Deploy to Cloud Run
      #    WebSocket support: Cloud Run natively supports WebSocket connections.
      #    The --session-affinity flag helps keep WS connections sticky.
      - name: Deploy to Cloud Run
        run: |-
          DOCKER_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image $DOCKER_TAG \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --session-affinity \
            --timeout=3600
