name: API Service CI/CD to GCP

on:
  push:
    branches: [ "main", "async" ]
    paths:
      - 'api_service/**'
      - '.github/workflows/api-service-cicd.yml'
      - 'docker-compose.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'api_service/**'
      - '.github/workflows/api-service-cicd.yml'

env:
  PROJECT_ID: 'touristassistant-29-03-2026'
  REGION: 'asia-southeast1'
  GAR_REPO: 'tourism-frontend'
  SERVICE_NAME: 'tourism-api-service'
  IMAGE_NAME: 'api-service'

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  # ── Job 1 : Build & Validation ──────────────────────────────────────────
  validate:
    name: Go Build & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: api_service/go.sum

      - name: Download dependencies
        working-directory: ./api_service
        run: go mod tidy

      - name: Build binary
        working-directory: ./api_service
        run: go build -o api_service .

      - name: Run vet
        working-directory: ./api_service
        run: go vet ./...

  # ── Job 2 : Docker Compose Integration Test ──────────────────────────────
  integration-test:
    name: Integration Test (Docker Compose)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env from defaults
        run: |
          cp .env.example .env || true
          cp login/.env.example login/.env || true
          touch rag/.env || true

      - name: Start services via Docker Compose
        run: docker compose up -d --build --wait api_service pubsub pubsub-init

      - name: Wait for API Service to be ready
        run: |
          echo "Waiting for API Service to respond on port 8081..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081 > /dev/null 2>&1; then
              echo "API Service is up!"
              exit 0
            fi
            # Also check if the container is at least running
            if docker compose ps api_service | grep -q "Up"; then
              echo "API Service container is running (attempt $i/30)"
              # Try a POST to the actual endpoint to confirm readiness
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
                -H "Content-Type: application/json" \
                -d '{"userId":"test","query":"test"}' \
                http://localhost:8081/api/v1/jobs/submit 2>&1 || true)
              if [ "$STATUS" != "000" ]; then
                echo "API Service responded with HTTP $STATUS — it's up!"
                exit 0
              fi
            fi
            echo "  attempt $i/30 — not ready yet, retrying in 5s..."
            sleep 5
          done
          echo "API Service failed to start in time."
          docker compose logs api_service
          exit 1

      - name: Verify Pub/Sub emulator is running
        run: |
          curl -sf http://localhost:8085 > /dev/null 2>&1 || true
          echo "Pub/Sub emulator is reachable"

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ── Job 3 : Build & Deploy ──────────────────────────────────────────────
  deploy:
    name: Build & Deploy to Cloud Run
    needs: integration-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Authenticate to GCP via WIF
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 2. Configure Docker to use GCP Artifact Registry
      - name: Configure Docker Auth
        run: |-
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # 3. Build & Push using the API Service Dockerfile
      - name: Build and Push Docker Image
        working-directory: ./api_service
        run: |-
          DOCKER_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build -t $DOCKER_TAG .
          docker push $DOCKER_TAG

      # 4. Provision Pub/Sub infrastructure
      - name: Provision Pub/Sub Topics and Subscriptions
        run: |-
          echo "Creating topics if they don't exist..."
          gcloud pubsub topics create ai-jobs --quiet || echo "Topic already exists"
          gcloud pubsub topics create task-enrich --quiet || echo "Topic already exists"
          gcloud pubsub topics create ai-results --quiet || echo "Topic already exists"
          
          echo "Creating push subscriptions..."
          gcloud pubsub subscriptions create api-calling-sub \
            --topic=ai-jobs \
            --push-endpoint=https://tourism-api-calling-367022044809.asia-southeast1.run.app/pubsub/push \
            --quiet || echo "Subscription already exists"
            
          gcloud pubsub subscriptions create worker-sub \
            --topic=task-enrich \
            --push-endpoint=https://tourism-worker-service-367022044809.asia-southeast1.run.app/pubsub/push \
            --quiet || echo "Subscription already exists"
            
          gcloud pubsub subscriptions create notification-sub \
            --topic=ai-results \
            --push-endpoint=https://tourism-notification-service-367022044809.asia-southeast1.run.app/pubsub/results \
            --quiet || echo "Subscription already exists"

      # 5. Deploy to Cloud Run
      - name: Deploy to Cloud Run
        run: |-
          DOCKER_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image $DOCKER_TAG \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }}"
