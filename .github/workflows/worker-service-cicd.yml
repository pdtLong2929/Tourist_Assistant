name: Worker Service CI/CD to GCP

on:
  push:
    branches: [ "main", "async" ]
    paths:
      - 'worker_service/**'
      - '.github/workflows/worker-service-cicd.yml'
      - 'docker-compose.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'worker_service/**'
      - '.github/workflows/worker-service-cicd.yml'

env:
  PROJECT_ID: 'touristassistant-29-03-2026'
  REGION: 'asia-southeast1'
  GAR_REPO: 'tourism-frontend'
  SERVICE_NAME: 'tourism-worker-service'
  IMAGE_NAME: 'worker-service'

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  # ── Job 1 : Build & Validation ──────────────────────────────────────────
  validate:
    name: Go Build & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: worker_service/go.sum

      - name: Download dependencies
        working-directory: ./worker_service
        run: go mod tidy

      - name: Build binary
        working-directory: ./worker_service
        run: go build -o worker_service .

      - name: Run vet
        working-directory: ./worker_service
        run: go vet ./...

  # ── Job 2 : Docker Compose Integration Test ──────────────────────────────
  integration-test:
    name: Integration Test (Docker Compose)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env from defaults
        run: |
          cp .env.example .env || true
          cp login/.env.example login/.env || true
          touch rag/.env || true

      - name: Start services via Docker Compose
        run: docker compose up -d --build --wait worker_service pubsub pubsub-init

      - name: Wait for Worker Service to be ready
        run: |
          echo "Waiting for Worker Service to respond on port 8001..."
          for i in $(seq 1 30); do
            if docker compose ps worker_service | grep -q "Up"; then
              # Try posting to the push endpoint to see if Gin is ready
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
                -H "Content-Type: application/json" \
                -d '{}' \
                http://localhost:8001/pubsub/push 2>&1 || true)
              if [ "$STATUS" != "000" ]; then
                echo "Worker Service responded with HTTP $STATUS — it's up!"
                exit 0
              fi
            fi
            echo "  attempt $i/30 — not ready yet, retrying in 5s..."
            sleep 5
          done
          echo "Worker Service failed to start in time."
          docker compose logs worker_service
          exit 1

      - name: Verify Pub/Sub emulator is running
        run: |
          curl -sf http://localhost:8085 > /dev/null 2>&1 || true
          echo "Pub/Sub emulator is reachable"

      - name: Verify Pub/Sub topics were created
        run: |
          echo "Checking ai-jobs topic..."
          curl -s http://localhost:8085/v1/projects/test-project/topics | grep -q "ai-jobs" && echo "✓ ai-jobs topic exists" || echo "⚠ ai-jobs topic not found"
          echo "Checking ai-results topic..."
          curl -s http://localhost:8085/v1/projects/test-project/topics | grep -q "ai-results" && echo "✓ ai-results topic exists" || echo "⚠ ai-results topic not found"

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ── Job 3 : Build & Deploy ──────────────────────────────────────────────
  deploy:
    name: Build & Deploy to Cloud Run
    needs: integration-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Authenticate to GCP via WIF
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 2. Configure Docker to use GCP Artifact Registry
      - name: Configure Docker Auth
        run: |-
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # 3. Build & Push using the Worker Service Dockerfile
      - name: Build and Push Docker Image
        working-directory: ./worker_service
        run: |-
          DOCKER_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build -t $DOCKER_TAG .
          docker push $DOCKER_TAG

      # 4. Deploy to Cloud Run
      #    The worker receives Pub/Sub push messages, so it needs to be
      #    accessible via HTTPS. Cloud Run provides this automatically.
      - name: Deploy to Cloud Run
        run: |-
          DOCKER_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image $DOCKER_TAG \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }},RAG_SERVICE_URL=https://tourism-rag-service-367022044809.asia-southeast1.run.app"
